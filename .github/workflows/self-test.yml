# app-kit 自身の確かめ。道具の確かめと、fixtures/ のアプリ（App・MacApp・ExtensionApp）に対して再利用ワークフローを流す。
# ルールセットで必須にするチェック（tools・build / build）が、ドキュメントだけの PR でも出るよう、paths で絞らない
name: self-test

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test read-config.sh
        run: bash tools/tests/test-read-config.sh

      - name: Test embed_archive_entitlements.py
        # Archive に entitlements を入れる道具（xcodebuild・codesign は偽物に差し替える）
        run: python3 tools/tests/test_embed_archive_entitlements.py

      - name: Test screenshot matrix
        # 撮影の plan が作る matrix（max_parallel と言語の分け方）
        run: python3 tools/tests/test-screenshot-matrix.py

      - name: ShellCheck
        run: shellcheck tools/*.sh tools/tests/*.sh tools/screenshots/*.sh

      - name: Test creative spec
        run: python3 tools/tests/test_creative_spec.py

      - name: Validate creative spec schema
        # 見本の案が schema/creative-spec.schema.json に合うこと（tools/creative/creative_spec.py と同じ形を書いているか）
        run: pipx run check-jsonschema==0.33.0 --schemafile schema/creative-spec.schema.json tools/tests/creative/spec.json

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Test manifest and managed files
        run: bash tools/tests/test-manifest.sh "$RUNNER_TEMP/rendered"

      - name: actionlint (managed workflows)
        # 版を埋めた呼ぶ側のワークフローを確かめる
        working-directory: ${{ runner.temp }}/rendered
        run: |
          mapfile -t workflows < <(ls .github/workflows/*.yml)
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color "${workflows[@]}"

      - name: Validate fixture screenshot configs
        # 撮影の再利用ワークフローの plan と同じ確かめ（撮るのは試しの 1 本のリポジトリで確かめる）
        run: |
          for app in fixtures/*/; do
            [[ -d "$app/AppStore" ]] || continue
            echo "::group::$app"
            APP_STORE_ROOT="$PWD/$app" python3 tools/screenshots/app_store_config.py languages "" > /dev/null
            APP_STORE_ROOT="$PWD/$app" python3 tools/screenshots/app_store_config.py scenes
            APP_STORE_ROOT="$PWD/$app" python3 tools/screenshots/app_store_config.py display-types "" | python3 -m json.tool
            APP_STORE_ROOT="$PWD/$app" python3 tools/screenshots/app_store_config.py display-types "" --max-parallel 5 | python3 -m json.tool
            echo "::endgroup::"
          done

      - name: Validate fixture configs
        # fixtures の設定が、今の版の read-config.sh で読めること
        run: |
          for config in fixtures/*/.github/app-kit.json; do
            echo "::group::$config"
            tools/read-config.sh "$config"
            echo "::endgroup::"
          done

  build:
    # 同じリポジトリの再利用ワークフローを、同じ版の道具で流す。PR では、ローカルの再利用ワークフローと checkout が
    # merge commit を使うので、道具も github.sha（PR では merge commit、push では push したコミット）にそろえる
    uses: ./.github/workflows/app-build.yml
    with:
      app-kit-ref: ${{ github.sha }}
      working-directory: fixtures/App

  archive:
    # 鍵の要らないところ（Archive・スタブの署名・entitlements を入れる）までを確かめる
    uses: ./.github/workflows/app-archive.yml
    with:
      app-kit-ref: ${{ github.sha }}
      export: false
      working-directory: fixtures/App

  archive-extension:
    # App Extension（ウィジェット）を持つ iOS のアプリ（fixtures/ExtensionApp）。署名なしの Archive に、ウィジェットから順に
    # App Groups を入れる（鍵の要らないところまで。Build は fixtures/App で確かめるので流さない）
    uses: ./.github/workflows/app-archive.yml
    with:
      app-kit-ref: ${{ github.sha }}
      export: false
      working-directory: fixtures/ExtensionApp

  build-macos:
    # macOS だけのアプリ（fixtures/MacApp）。テストはアドホック署名・App Sandbox なしで流す
    uses: ./.github/workflows/app-build.yml
    with:
      app-kit-ref: ${{ github.sha }}
      working-directory: fixtures/MacApp

  archive-macos:
    # macOS はアドホック署名で Archive し、自動の署名のときだけ付ける entitlement（push）を本体に足して、
    # Mac App Store に要る App Sandbox とカテゴリを確かめる（鍵の要らないところまで）。ウィジェットの entitlements は Archive のまま
    uses: ./.github/workflows/app-archive.yml
    with:
      app-kit-ref: ${{ github.sha }}
      export: false
      working-directory: fixtures/MacApp

  archive-entitlements:
    # Archive のジョブが上げた entitlements の記録で、本体と中のバンドルの署名に、入れるはずの entitlements があるかを確かめる
    # （ウィジェットを見落とすと、Archive のジョブは通っても記録にウィジェットが無い・キーが足りない）
    needs: [archive, archive-extension, archive-macos]
    name: archive-entitlements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download entitlements records
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: entitlements-*
          path: ${{ runner.temp }}/entitlements

      - name: Check records
        run: |
          records="$RUNNER_TEMP/entitlements"
          echo "::group::fixtures/App（entitlements なし。署名しない）"
          python3 tools/tests/check_entitlements_record.py "$records/entitlements-iOS-fixtures-App/archive.json" 'FixtureApp.app='
          echo "::endgroup::"
          echo "::group::fixtures/ExtensionApp（本体とウィジェットに App Groups）"
          python3 tools/tests/check_entitlements_record.py "$records/entitlements-iOS-fixtures-ExtensionApp/archive.json" \
            'FixtureExtensionApp.app=com.apple.security.application-groups' \
            'FixtureExtensionApp.app/PlugIns/FixtureExtensionWidget.appex=com.apple.security.application-groups'
          echo "::endgroup::"
          echo "::group::fixtures/MacApp（本体に push を足し、ウィジェットは Archive の sandbox と App Groups のまま）"
          python3 tools/tests/check_entitlements_record.py "$records/entitlements-macOS-fixtures-MacApp/archive.json" \
            'FixtureMacApp.app=com.apple.developer.aps-environment,com.apple.security.app-sandbox,com.apple.security.application-groups,com.apple.security.files.user-selected.read-only' \
            'FixtureMacApp.app/Contents/PlugIns/FixtureMacWidget.appex=com.apple.security.app-sandbox,com.apple.security.application-groups'
          echo "::endgroup::"

  creative-render:
    # クリエイティブアセットの書き出しの道具を、仮の画面と見本の案で確かめる（はみ出し・無い画面・再現性）
    name: creative-render
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test render_creative.py
        run: bash tools/tests/test-creative-render.sh

  creative-screens:
    # 再利用ワークフロー（app-creative-assets.yml）に渡す、6.9 inch の撮影の artifact の代わり
    name: creative-screens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spec: ${{ steps.spec.outputs.spec }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make screens
        run: python3 tools/tests/creative/make_screens.py "$RUNNER_TEMP/screens" ja,en 01_home,02_detail,03_settings

      - name: Upload screens as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-APP_IPHONE_67
          path: ${{ runner.temp }}/screens
          if-no-files-found: error

      - name: Read spec
        id: spec
        run: echo "spec=$(jq -c . tools/tests/creative/spec.json)" >> "$GITHUB_OUTPUT"

  creative:
    # 呼ぶ側と同じく、案を文字列の入力で渡して書き出す
    needs: creative-screens
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-creative-assets.yml
    with:
      app-kit-ref: ${{ github.sha }}
      spec: ${{ needs.creative-screens.outputs.spec }}
      working-directory: fixtures/App

  creative-check:
    # 書き出した artifact の形（司令塔が取り込む形）を確かめる
    needs: creative
    name: creative-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download creative assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: creative-assets
          path: ${{ runner.temp }}/creative

      - name: Download report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: creative-report
          path: ${{ runner.temp }}/creative-report

      - name: Check artifacts
        run: python3 tools/tests/creative/check_report.py "$RUNNER_TEMP/creative-report/report.json" "$RUNNER_TEMP/creative" ja,en-US
