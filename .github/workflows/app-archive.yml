# 各リポジトリの Upload・Archive から呼ぶ再利用ワークフロー（Archive → 書き出し → App Store Connect への Upload）。
# リポジトリごとの値は、呼んだ側の .github/app-kit.json から読む（archive.platforms のプラットフォームごとに 1 つのジョブ）。
# 書き出すのは、iOS・visionOS は IPA、macOS は pkg（Mac App Store）。どれも同じ ExportOptions.plist（Secret EXPORT_OPTIONS）で書き出す。
#
# 認証はすべて App Store Connect の API キーで行う（Apple ID・App 用パスワードは使わない）。
# Upload は ExportOptions.plist の destination を upload にした xcodebuild -exportArchive で行う。
# Secrets は、組織をまたぐと secrets: inherit が効かないので、呼ぶ側で名前を並べて渡す。
# 書き出した IPA・pkg は artifact に上げない（public のリポジトリでは誰でも取れるため）。
name: app-archive

on:
  workflow_call:
    inputs:
      app-kit-ref:
        description: 呼んだ app-kit のコミット（uses の @ の後ろと同じ 40 桁）。この版の道具を取り出して使う
        type: string
        required: true
      export:
        description: Archive の後に IPA・pkg の書き出しまで行うか（App Store Connect の API キーが要る）。false なら Archive だけを確かめる
        type: boolean
        default: true
      upload:
        description: 書き出した IPA・pkg を App Store Connect に上げるか（export が true のときだけ）
        type: boolean
        default: false
      working-directory:
        description: アプリのあるディレクトリ（リポジトリの直下から）。設定はこの下の .github/app-kit.json を読む
        type: string
        default: '.'
      runs-on:
        description: Archive のランナーのラベル
        type: string
        default: macos-latest
      configuration:
        description: Archive するビルドの構成の名前（.github/app-kit.json の archive.configurations のどれか）。空ならブランチで決める
        type: string
        default: ''
    secrets:
      EXPORT_OPTIONS:
        description: ExportOptions.plist の内容（destination と、Upload のときの manageAppVersionAndBuildNumber はワークフローが上書きする）
        required: false
      APPLE_API_KEY_BASE64:
        description: App Store Connect の API キー（.p8）を base64 にしたもの
        required: false
      APPLE_API_KEY_ID:
        description: App Store Connect の API キーの Key ID
        required: false
      APPLE_API_ISSUER_ID:
        description: App Store Connect の API キーの Issuer ID
        required: false
      TESTFLIGHT_INTERNAL_TESTERS:
        description: TestFlight の内部テスターにする人のメールアドレス（カンマ区切り。無ければ内部テスターの設定を省く）
        required: false
      GOOGLE_SERVICE_INFO_PLIST_BASE64:
        description: GoogleService-Info.plist を base64 にしたもの（.github/app-kit.json の archive.googleServiceInfo か、構成の googleServiceInfo.secret で選んだリポジトリだけ）
        required: false
      GOOGLE_SERVICE_INFO_PLIST_DEV:
        description: 構成ごとに Firebase のプロジェクトを分けるリポジトリの、dev の GoogleService-Info.plist を base64 にしたもの（構成の googleServiceInfo.secret で選ぶ）
        required: false
      GOOGLE_SERVICE_INFO_PLIST_PROD:
        description: 構成ごとに Firebase のプロジェクトを分けるリポジトリの、prod の GoogleService-Info.plist を base64 にしたもの（構成の googleServiceInfo.secret で選ぶ）
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      platforms: ${{ steps.config.outputs.platforms }}
      first-platform: ${{ steps.config.outputs.first-platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app-kit
        env:
          APP_KIT_REF: ${{ inputs.app-kit-ref }}
        run: |
          if [[ ! "$APP_KIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::app-kit-ref は app-kit のコミット（40 桁）にしてください: $APP_KIT_REF"
            exit 1
          fi
          dir="$RUNNER_TEMP/app-kit"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/shilokuma-inc/app-kit.git "$APP_KIT_REF"
          git -C "$dir" checkout -q --detach FETCH_HEAD
          echo "APP_KIT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Read .github/app-kit.json
        id: config
        run: |
          "$APP_KIT_DIR/tools/read-config.sh" .github/app-kit.json > "$RUNNER_TEMP/app-kit.env"
          cat "$RUNNER_TEMP/app-kit.env"
          platforms=$(sed -n 's/^APP_KIT_ARCHIVE_PLATFORMS_JSON=//p' "$RUNNER_TEMP/app-kit.env")
          {
            echo "platforms=$platforms"
            echo "first-platform=$(jq -r '.[0]' <<<"$platforms")"
          } >> "$GITHUB_OUTPUT"

  archive:
    name: archive (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app-kit
        env:
          APP_KIT_REF: ${{ inputs.app-kit-ref }}
        run: |
          dir="$RUNNER_TEMP/app-kit"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/shilokuma-inc/app-kit.git "$APP_KIT_REF"
          git -C "$dir" checkout -q --detach FETCH_HEAD
          echo "APP_KIT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Read .github/app-kit.json
        id: config
        env:
          PLATFORM: ${{ matrix.platform }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          "$APP_KIT_DIR/tools/read-config.sh" .github/app-kit.json > "$RUNNER_TEMP/app-kit.env"
          cat "$RUNNER_TEMP/app-kit.env" >> "$GITHUB_ENV"
          echo "xcode-version=$(sed -n 's/^APP_KIT_XCODE_VERSION=//p' "$RUNNER_TEMP/app-kit.env")" >> "$GITHUB_OUTPUT"
          # このプラットフォームのスキーム（.github/app-kit.json の schemes。無ければ scheme）で Archive する
          schemes=$(sed -n 's/^APP_KIT_SCHEMES_JSON=//p' "$RUNNER_TEMP/app-kit.env")
          echo "APP_KIT_ARCHIVE_SCHEME=$(jq -r --arg platform "$PLATFORM" '.[$platform]' <<<"$schemes")" >> "$GITHUB_ENV"
          case "$PLATFORM" in
            iOS) sdk=iphoneos ;;
            visionOS) sdk=xros ;;
            macOS) sdk=macosx ;;
            *) echo "::error::Archive できないプラットフォームです: $PLATFORM"; exit 1 ;;
          esac
          # entitlements の記録の artifact の名前。1 回の実行で fixture ごとに呼ぶ self-test のために、
          # working-directory が . 以外なら、その道を - でつないで後ろに付ける（artifact の名前に / は使えない）
          artifact="entitlements-$PLATFORM"
          if [[ "$WORKING_DIRECTORY" != "." ]]; then
            artifact="$artifact-$(printf '%s' "${WORKING_DIRECTORY#./}" | sed -e 's#/*$##' -e 's#[^A-Za-z0-9._-]#-#g')"
          fi
          echo "entitlements-artifact=$artifact" >> "$GITHUB_OUTPUT"
          # ExportOptions.plist と API の秘密鍵は、リポジトリの下ではなく RUNNER_TEMP に置く
          {
            echo "SDK=$sdk"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/build.xcarchive"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
            echo "ENTITLEMENTS_DIR=$RUNNER_TEMP/entitlements"
          } >> "$GITHUB_ENV"

      - name: Choose configuration
        # Archive するビルドの構成を、.github/app-kit.json の archive.configurations とブランチ（手動の実行で名前を選んだらそれ）から決める。
        # archive.configurations が無ければ、今までと同じ Release と archive.googleServiceInfo
        env:
          BRANCH: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.configuration }}
        run: |
          "$APP_KIT_DIR/tools/select-configuration.sh" "$BRANCH" "$REQUESTED" > "$RUNNER_TEMP/configuration.env"
          cat "$RUNNER_TEMP/configuration.env"
          cat "$RUNNER_TEMP/configuration.env" >> "$GITHUB_ENV"
          configuration=$(sed -n 's/^APP_KIT_CONFIGURATION=//p' "$RUNNER_TEMP/configuration.env")
          echo "構成 \`$configuration\` で Archive します（ブランチ \`$BRANCH\`）" >> "$GITHUB_STEP_SUMMARY"

      - name: Check secrets
        # 書き出しには App Store Connect の API キーと ExportOptions.plist が要る。足りなければ、どの Secret かを出して止める（値は出さない）
        if: inputs.export
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=()
          [[ -n "$EXPORT_OPTIONS" ]] || missing+=(EXPORT_OPTIONS)
          [[ -n "$APPLE_API_KEY_BASE64" ]] || missing+=(APPLE_API_KEY_BASE64)
          [[ -n "$APPLE_API_KEY_ID" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "$APPLE_API_ISSUER_ID" ]] || missing+=(APPLE_API_ISSUER_ID)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Secrets が足りません: ${missing[*]}（呼ぶ側のワークフローの secrets で渡しているか、リポジトリか organization に登録してあるかを確かめてください）"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.config.outputs.xcode-version }}

      - name: Generate project with XcodeGen
        if: env.APP_KIT_GENERATE == 'xcodegen'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Allow build tool plugins and macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Install visionOS platform
        # ランナーのイメージから visionOS が外れたときに備えて、無ければ選んだ Xcode に合うものを入れる
        if: matrix.platform == 'visionOS'
        run: |
          xcodebuild -showsdks | grep -q xros || xcodebuild -downloadPlatform visionOS

      - name: Create GoogleService-Info.plist
        # GoogleService-Info.plist はリポジトリに入れない。この構成の Secret があれば書き出してアプリに入れる。
        # 無いときは Firebase につながないビルドになるので、注釈で知らせる。構成の googleServiceInfo.required が true なら、Upload では止める
        # （Firebase に繋がらないビルドを App Store 用に上げない）。Secrets はシェル展開ではなく env で渡し、中身はログに出さない
        if: env.APP_KIT_GOOGLE_SERVICE_INFO_PATH != ''
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_DEV: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
          GOOGLE_SERVICE_INFO_PLIST_PROD: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
          UPLOAD: ${{ inputs.export && inputs.upload }}
        run: |
          case "$APP_KIT_GOOGLE_SERVICE_INFO_SECRET" in
            GOOGLE_SERVICE_INFO_PLIST_BASE64) encoded=$GOOGLE_SERVICE_INFO_PLIST_BASE64 ;;
            GOOGLE_SERVICE_INFO_PLIST_DEV) encoded=$GOOGLE_SERVICE_INFO_PLIST_DEV ;;
            GOOGLE_SERVICE_INFO_PLIST_PROD) encoded=$GOOGLE_SERVICE_INFO_PLIST_PROD ;;
            *) echo "::error::読めない Secret の名前です: $APP_KIT_GOOGLE_SERVICE_INFO_SECRET"; exit 1 ;;
          esac
          if [[ -z "$encoded" ]]; then
            message="Secret $APP_KIT_GOOGLE_SERVICE_INFO_SECRET が無いため、構成 $APP_KIT_CONFIGURATION は Firebase につながないビルドになります"
            if [[ "$APP_KIT_GOOGLE_SERVICE_INFO_REQUIRED" == "true" && "$UPLOAD" == "true" ]]; then
              echo "::error::${message}。この構成は plist が要る（googleServiceInfo.required）ので、上げません"
              exit 1
            fi
            echo "::warning::$message"
            echo "⚠️ $message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$(dirname "$APP_KIT_GOOGLE_SERVICE_INFO_PATH")"
          if ! printf '%s' "$encoded" | base64 --decode > "$APP_KIT_GOOGLE_SERVICE_INFO_PATH" 2>/dev/null \
            || ! plutil -lint -s "$APP_KIT_GOOGLE_SERVICE_INFO_PATH" >/dev/null 2>&1; then
            rm -f "$APP_KIT_GOOGLE_SERVICE_INFO_PATH"
            echo "::error::Secret $APP_KIT_GOOGLE_SERVICE_INFO_SECRET を plist として読めません。GoogleService-Info.plist を base64 にした値を登録してください"
            exit 1
          fi
          echo "APP_KIT_GOOGLE_SERVICE_INFO_WRITTEN=true" >> "$GITHUB_ENV"
          echo "$APP_KIT_GOOGLE_SERVICE_INFO_PATH を書き出しました"

      - name: Archive
        # 本番の署名は Export がする。iOS・visionOS は署名せずに Archive する（アドホック署名は、push などの entitlement が
        # provisioning profile を要するため「requires a provisioning profile」で止まる）。
        # macOS はアドホック署名で Archive する。署名しないと ENABLE_APP_SANDBOX などのビルドの設定から作られる entitlement が入らず、
        # Export でも足されないので、App Store Connect が App Sandbox の無いアプリとして断る
        run: |
          if [[ "$SDK" == "macosx" ]]; then
            xcodebuild archive \
              -project "$APP_KIT_PROJECT" \
              -scheme "$APP_KIT_ARCHIVE_SCHEME" \
              -destination 'generic/platform=macOS' \
              -configuration "$APP_KIT_CONFIGURATION" \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER=
          else
            xcodebuild archive \
              -project "$APP_KIT_PROJECT" \
              -scheme "$APP_KIT_ARCHIVE_SCHEME" \
              -sdk "$SDK" \
              -configuration "$APP_KIT_CONFIGURATION" \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Fix signatures of stub frameworks
        # 静的な xcframework（Firebase・Google Mobile Ads など）は、同梱するときに Xcode がバイナリを外して空のスタブを差し込む。
        # スタブはリンカーの仮の署名のままで識別子が arm64-apple になっていて、署名なしの Archive では Xcode の署名で直らない。
        # Export はこの識別子のまま再署名するので、App Store Connect が Invalid Signature で弾く。
        # Info.plist の CFBundleIdentifier と識別子が違うフレームワーク（本体と App Extension の Frameworks/）を、その識別子でアドホック署名し直す（本番の署名は Export がする）。
        # macOS はアドホック署名で Archive するので、同梱するときに Xcode が署名する（ここで署名し直すと、アプリの署名が合わなくなる）
        if: matrix.platform != 'macOS'
        run: '"$APP_KIT_DIR/tools/fix-stub-framework-signatures.sh" "$ARCHIVE_PATH"'

      - name: Embed entitlements into the archive
        # Export は Archive の中の各バンドルの署名にある entitlement だけを引き継ぐ。署名なしの Archive（iOS・visionOS）には entitlements の
        # ファイル（CODE_SIGN_ENTITLEMENTS）が入らないので、そのままだと配信ビルドに基本の entitlement しか付かず、WeatherKit や
        # ウィジェットの App Groups などが実機で動かない。本体と中のバンドル（App Extension など）を、$(…) を展開した entitlements の
        # ファイルで、内側から順にアドホック署名しておく（本番の署名は Export がする）。
        # macOS は本体のアドホック署名の entitlement（sandbox など）に、プロジェクトの既定の署名で読んだファイルの項目を足す（push のように、
        # アドホック署名のビルドでは付けられない entitlement のため）。macOS の中のバンドルには足さず、足りなければ止める。
        # バンドルごとのソースの entitlements と署名の結果を、記録（JSON）と Job Summary に出す
        run: |
          python3 "$APP_KIT_DIR/tools/embed_archive_entitlements.py" embed "$ARCHIVE_PATH" \
            --project "$APP_KIT_PROJECT" \
            --scheme "$APP_KIT_ARCHIVE_SCHEME" \
            --sdk "$SDK" \
            --configuration "$APP_KIT_CONFIGURATION" \
            --record "$ENTITLEMENTS_DIR/archive.json"

      - name: Check GoogleService-Info.plist in the app
        # 書き出した plist がアプリに入ったか、ほかの構成の plist が入っていないかを確かめる
        # （取り違えて、本番のアプリが dev の Firebase に繋がったり、どこにも繋がらなかったりしないように）
        if: env.APP_KIT_GOOGLE_SERVICE_INFO_PATH != '' || env.APP_KIT_GOOGLE_SERVICE_INFO_OTHERS != ''
        run: |
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$ARCHIVE_PATH/Info.plist")
          resources="$ARCHIVE_PATH/Products/$app_path"
          if [[ "$SDK" == "macosx" ]]; then
            resources="$resources/Contents/Resources"
          fi
          failed=false
          if [[ "${APP_KIT_GOOGLE_SERVICE_INFO_WRITTEN:-}" == "true" ]]; then
            name=$(basename "$APP_KIT_GOOGLE_SERVICE_INFO_PATH")
            if [[ -f "$resources/$name" ]]; then
              echo "$name がアプリに入っています"
            else
              echo "::error::書き出した $name がアプリに入っていません（ターゲットのリソースに入る場所か、構成 $APP_KIT_CONFIGURATION の EXCLUDED_SOURCE_FILE_NAMES を確かめてください）"
              failed=true
            fi
          fi
          read -ra others <<<"$APP_KIT_GOOGLE_SERVICE_INFO_OTHERS"
          for name in "${others[@]}"; do
            if [[ -e "$resources/$name" ]]; then
              echo "::error::構成 $APP_KIT_CONFIGURATION のアプリに、ほかの構成の $name が入っています"
              failed=true
            fi
          done
          [[ "$failed" == "false" ]]

      - name: Upload dSYMs to Crashlytics
        # TestFlight・App Store に上げるビルドの dSYM を Crashlytics に上げ、クラッシュの記録を記号化できるようにする（.github/app-kit.json の archive.crashlytics）。
        # SPM が取ってきた firebase-ios-sdk の Crashlytics/upload-symbols を、書き出した plist で呼ぶ（Run Script のビルドフェーズは project.pbxproj を変えるので使わない）。
        # 上げないビルド（手動の Archive）は配らないので上げない。plist・道具・dSYM が無いときと、上げるのに失敗したときは、注釈を出して Upload は止めない
        if: inputs.export && inputs.upload && env.APP_KIT_CRASHLYTICS == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$SDK" in
            iphoneos) platform=ios ;;
            macosx) platform=mac ;;
            *) platform="" ;;
          esac
          upload_symbols=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -type f \
            -path '*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' 2>/dev/null | head -1)
          dsyms="$ARCHIVE_PATH/dSYMs"
          message=""
          if [[ "${APP_KIT_GOOGLE_SERVICE_INFO_WRITTEN:-}" != "true" ]]; then
            message="GoogleService-Info の plist を書き出していないので、dSYM を Crashlytics に上げませんでした"
          elif [[ -z "$platform" ]]; then
            message="$PLATFORM の dSYM は Crashlytics に上げません（iOS と macOS だけ）"
          elif [[ -z "$upload_symbols" ]]; then
            message="firebase-ios-sdk の Crashlytics/upload-symbols が見つからないため、dSYM を Crashlytics に上げませんでした"
          elif [[ ! -d "$dsyms" ]] || [[ -z "$(ls -A "$dsyms")" ]]; then
            message="Archive に dSYM が無いため、Crashlytics に上げませんでした"
          elif ! "$upload_symbols" --google-service-plist "$APP_KIT_GOOGLE_SERVICE_INFO_PATH" --platform "$platform" "$dsyms"; then
            message="dSYM を Crashlytics に上げられませんでした（クラッシュの記録が記号化されません）"
          fi
          if [[ -n "$message" ]]; then
            echo "::warning::$message"
            echo "⚠️ $message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "dSYM を Crashlytics に上げました（構成 $APP_KIT_CONFIGURATION）"

      - name: Check Mac App Store requirements
        # App Sandbox と Info.plist の LSApplicationCategoryType が無いと、ビルドも書き出しも通るのに App Store Connect への Upload で断られる。
        # 鍵が要らないので、書き出しの前（export が false のときも）に確かめる
        if: matrix.platform == 'macOS'
        run: python3 "$APP_KIT_DIR/tools/embed_archive_entitlements.py" mac-requirements "$ARCHIVE_PATH"

      - name: Create ExportOptions.plist and API private key
        # Secrets はシェル展開ではなく env で渡す
        if: inputs.export
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$EXPORT_OPTIONS" > "$EXPORT_OPTIONS_PATH"
          plutil -lint "$EXPORT_OPTIONS_PATH"
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Export ${{ matrix.platform == 'macOS' && 'pkg' || 'IPA' }}
        # 同じ ExportOptions.plist から、iOS・visionOS は IPA、macOS は pkg（Mac Installer Distribution で署名）が出る
        if: inputs.export
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string export "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Verify entitlements of the exported ${{ matrix.platform == 'macOS' && 'pkg' || 'IPA' }}
        # Archive の本体と中のバンドルごとに、Archive の署名の entitlement と、記録のソースの entitlement が、
        # 書き出した IPA・pkg の同じ場所のバンドルにも残っているかを確かめる。
        # 配布用の profile に無い entitlement を Export が落とすと、ビルドも Upload も通るのに、実機でその機能だけ動かない
        if: inputs.export
        run: |
          python3 "$APP_KIT_DIR/tools/embed_archive_entitlements.py" check "$ARCHIVE_PATH" "$RUNNER_TEMP/export" \
            --record "$ENTITLEMENTS_DIR/archive.json" \
            --report "$ENTITLEMENTS_DIR/export.json"

      - name: Upload entitlements record
        # バンドルごとの entitlements（Archive と、書き出したもの）を JSON で上げる。self-test と、入れ替えの後の点検が、IPA を落とさずに読む。
        # 中身は配信したアプリからも読める値（Team ID・Bundle ID・App Group など）だけで、IPA・pkg は上げない。
        # 確かめで止まったときも、何が抜けたかを読めるように上げる（Re-run でも上げ直せるように overwrite）
        if: ${{ !cancelled() && steps.config.outputs.entitlements-artifact != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.config.outputs.entitlements-artifact }}
          path: ${{ runner.temp }}/entitlements
          if-no-files-found: ignore
          overwrite: true

      - name: Check app exists in App Store Connect
        # App Store Connect にアプリが無いと、Upload が "Error Downloading App Information" で落ち、原因が分かりにくい。
        # アプリの作成は API でできないので、読むだけで確かめ、無ければ作り方を Job Summary に出して止める
        if: inputs.export && inputs.upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist") \
          APP_NAME="$APP_KIT_SCHEME" \
            ruby "$APP_KIT_DIR/tools/app-store-connect/check-app-store-app.rb"

      - name: Check macOS platform in App Store Connect
        # iOS と macOS を出すアプリで、App Store Connect のアプリに macOS のプラットフォームをまだ足していないと、Upload が毎回落ちる。
        # 足すのは Web でしかできないので、読むだけで確かめ、無ければ手順を Job Summary に出して Upload を飛ばす（失敗にはしない）
        id: platform
        if: inputs.export && inputs.upload && matrix.platform == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist") \
          PLATFORM=MAC_OS \
            ruby "$APP_KIT_DIR/tools/app-store-connect/check-app-store-platform.rb"

      - name: Set up TestFlight internal testers
        # 内部テストグループ（すべてのビルドを自動で配る）を用意し、Secret TESTFLIGHT_INTERNAL_TESTERS のメールアドレスを内部テスターに入れる。
        # 失敗しても Upload は止めない（Job Summary と注釈で知らせる）。メールアドレスは Secret で渡す（変数の値はログにそのまま出るため）。
        # グループはアプリに 1 つ（プラットフォームによらない）なので、archive.platforms の先頭のジョブだけで行う（同時にグループを作らないように）
        if: inputs.export && inputs.upload && matrix.platform == needs.plan.outputs.first-platform && steps.platform.outputs.available != 'false'
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TESTERS: ${{ secrets.TESTFLIGHT_INTERNAL_TESTERS }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist") \
            ruby "$APP_KIT_DIR/tools/app-store-connect/ensure-internal-testers.rb"

      - name: Upload to App Store Connect
        # ビルド番号は Xcode に振らせる（manageAppVersionAndBuildNumber）。App Store Connect の最新のビルド番号を見て増やすので、
        # xcconfig の CURRENT_PROJECT_VERSION を手で上げなくてよい（iOS と macOS のビルド番号は別に数える）。
        # organization で共有する EXPORT_OPTIONS は書き換えず、ランナーの写しだけを変える
        if: inputs.export && inputs.upload && steps.platform.outputs.available != 'false'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string upload "$EXPORT_OPTIONS_PATH"
          plutil -replace manageAppVersionAndBuildNumber -bool YES "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
