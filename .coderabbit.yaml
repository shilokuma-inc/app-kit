# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定: https://docs.coderabbit.ai/reference/configuration
language: ja-JP

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.xcassets/**"
    - "!**/Package.resolved"
    - "!**/DerivedData/**"
  path_instructions:
    - path: ".github/workflows/**"
      # 観点の本文は CLAUDE.md に一元化している（Claude のセルフレビューと共通）
      instructions: |
        リポジトリ直下の CLAUDE.md にある「コードレビュー観点」に従ってレビューしてください。
    - path: "tools/**"
      instructions: |
        リポジトリ直下の CLAUDE.md にある「コードレビュー観点」に従ってレビューしてください。

chat:
  auto_reply: true
